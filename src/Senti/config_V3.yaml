# populate this config. structure
# we will populate the agent body config with this

selector:
  root: /mnt/e/nmmo_actinf/Senti/temp

handler:
  type: "Agent"  # TODO: list?
  # TODO: these are attributes technically encapsulated within an agent
  # however since our handler for now constructs all the agents
  # with the same blueprint, this carries onto its config.
  # will be challenging if our agents suddenly have different parameters
  # this is a Feburary kinda thing yk
  history: 2
  device: cuda
  batch_size: ${env.PLAYER_N}
  inference_steps: 25
  param_learning_steps: 5
  atomic_timestep: 2
  discrete_step: 2
  history_size: ${eval:"${agent.atomic_timestep} * ${handler.history}"}
  discrete_timestep: ${eval:"${agent.atomic_timestep} * ${agent.discrete_step}"}
  planning_horizon: 5
  planning_steps: 4

  agent:
    pref_gene_dim: 32
    policy_dim: 16
    n_policies: 4
    h_dim: [8, 8]
    z_dim: 8
    a_dim: 8
    obs_dim: 10
    state_depth: 3

    nmmo_obs_encoder:
      name: NmmoEncoders
      intermediate: 32
      hidden_size: ${agent.obs_dim}
      device: ${agent.device}

    nmmo_obs_decoder:
      name: NmmoDecoders
      intermediate: 32
      hidden_size: ${agent.obs_dim}
      device: ${agent.device}

    NmmoObsAE:
      encoder: ${agent.nmmo_obs_encoder}
      decoder: ${agent.nmmo_obs_decoder}

    zh_o:
      h_dim: ${agent.h_dim}
      z_dim: ${agent.z_dim}
      obs_dim: ${agent.obs_dim}
      hidden_dim: 20

    transition_model:
      h_dim: ${agent.h_dim}
      z_dim: ${agent.z_dim}
      a_dim: ${agent.a_dim}
      external_dim: ${agent.obs_dim}
      device: ${agent.device}
      hidden_dim: 20
      num_GRU_layers: ${agent.state_depth}

    deliberative_head:
      h_dim: ${agent.h_dim}
      z_dim: ${agent.z_dim}
      a_dim: ${agent.a_dim}
      pref_gene_dim: ${agent.pref_gene_dim}
      policy_dim: ${agent.policy_dim}

    grounding_wm:
      h_dim: ${agent.h_dim}
      z_dim: ${agent.z_dim}
      a_dim: ${agent.a_dim}
      external_dim: ${agent.pref_gene_dim}
      device: ${agent.device}
      hidden_dim: 20
      num_GRU_layers: ${agent.state_depth}

    habitual_head:
      h_dim: ${agent.h_dim}
      z_dim: ${agent.z_dim}
      a_dim: ${agent.a_dim}

    pref:
      h_dim: ${agent.h_dim}
      z_dim: ${agent.z_dim}

    policy_predictor:
      pref_gene_dim: ${agent.pref_gene_dim}
      policy_dim: ${agent.policy_dim}



  

